<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🐍 Snake Game</h1>
        
        <div class="info">
            <div class="score-box">
                <p>Score</p>
                <p id="score">0</p>
            </div>
            <div class="score-box">
                <p>High Score</p>
                <p id="highScore">0</p>
            </div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="controls">
            <p id="gameStatus">Use Arrow Keys or WASD to move</p>
            <button id="startBtn" class="btn btn-primary">Start Game</button>
            <button id="pauseBtn" class="btn btn-secondary" style="display: none;">Pause</button>
            <button id="resetBtn" class="btn btn-danger" style="display: none;">Reset</button>
        </div>

        <div class="instructions">
            <h3>📋 How to Play:</h3>
            <ul>
                <li>Use <strong>Arrow Keys</strong> or <strong>WASD</strong> to move the snake</li>
                <li>Eat the <strong>red food</strong> to grow and gain points</li>
                <li>Don't hit the walls or yourself!</li>
                <li>Each food eaten = 10 points</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
